
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test: ¿Qué deberías estudiar?</title>
</head>

<body bgcolor="#FFE3FA" text="#0d1117">

    <marquee behavior="scroll" direction="left" scrollamount="10">
        <h1>TEST: ¿QUÉ DEBERÍAS ESTUDIAR? (ITLA version)</h1>
    </marquee>

    <hr width="80%" size="2" color="#27A3F5" align="center">

    <p align="center">
        <tt>Responde las preguntas y deja de ser un vago</tt>
    </p>

    <p align="center">
        Progreso del test:
        <progress id="progreso" value="0" max="100">0%</progress>
    </p>

    <table border="1" cellpadding="10" width="80%" align="center" bgcolor="#FFFFFF">
        <tr>
            <td>
                <h3>1. ¿Qué te motiva más?</h3>

                <input type="radio" id="p1a" name="pregunta1" value="animacion">
                <label for="p1a">OwO (Ayudar a los demás)</label><br>

                <input type="radio" id="p1b" name="pregunta1" value="semiconductores">
                <label for="p1b">U_U (Complicarte la vida)</label><br>

                <input type="radio" id="p1c" name="pregunta1" value="ciberseguridad">
                <label for="p1c">$_$ (Ganar dinero)</label><br>

                <input type="radio" id="p1d" name="pregunta1" value="videojuegos">
                <label for="p1d">O_O (Tener un equilibrio)</label>
            </td>
        </tr>
    </table>

    <br>

    <table border="1" cellpadding="10" width="80%" align="center" bgcolor="#FFFFFF">
        <tr>
            <td>
                <h3>2. ¿Dónde prefieres trabajar?</h3>

                <input type="radio" id="p2a" name="pregunta2" value="telecomunicaciones">
                <label for="p2a">¬_¬ (En tu casa)</label><br>

                <input type="radio" id="p2b" name="pregunta2" value="ia">
                <label for="p2b">( ͡° ͜ʖ ͡°) (Híbrido)</label><br>

                <input type="radio" id="p2c" name="pregunta2" value="forense">
                <label for="p2c">ಠ_ಠ (Presencial)</label><br>

                <input type="radio" id="p2d" name="pregunta2" value="renovables">
                <label for="p2d">(▀̿Ĺ̯▀̿ ̿) (No trabajar)</label>
            </td>
        </tr>
    </table>

    <br>

    <table border="1" cellpadding="10" width="80%" align="center" bgcolor="#FFFFFF">
        <tr>
            <td>
                <h3>3. ¿Cómo prefieres trabajar?</h3>

                <input type="radio" id="p3a" name="pregunta3" value="redes">
                <label for="p3a">ヾ(⌐■_■) (Solo, en mi zona)</label><br>

                <input type="radio" id="p3b" name="pregunta3" value="mecatronica">
                <label for="p3b">(☞゚ヮ゚)☞ (En equipo pequeño)</label><br>

                <input type="radio" id="p3c" name="pregunta3" value="manufactura">
                <label for="p3c">ᕦ(ò_óˇ)ᕤ (Liderando un grupo)</label><br>

                <input type="radio" id="p3d" name="pregunta3" value="medicos">
                <label for="p3d">(╯°□°)╯ (Remoto, sin compromiso)</label>
            </td>
        </tr>
    </table>

    <br>

    <table border="1" cellpadding="10" width="80%" align="center" bgcolor="#FFFFFF">
        <tr>
            <td>
                <h3>4. ¿Qué asignatura odias más?</h3>

                <input type="radio" id="p4a" name="pregunta4" value="industrial">
                <label for="p4a">ಠ╭╮ಠ (Matemáticas)</label><br>

                <input type="radio" id="p4b" name="pregunta4" value="multimedia">
                <label for="p4b">(╬ಠ益ಠ) (Química)</label><br>

                <input type="radio" id="p4c" name="pregunta4" value="sonido">
                <label for="p4c">(ง •̀_•́)ง (Arte)</label><br>

                <input type="radio" id="p4d" name="pregunta4" value="software">
                <label for="p4d">Σ('◉⌓◉') (Informática)</label>
            </td>
        </tr>
    </table>

    <br>

    <table border="1" cellpadding="10" width="80%" align="center" bgcolor="#FFFFFF">
        <tr>
            <td>
                <h3>5. ¿Qué mascota prefieres?</h3>

                <input type="radio" id="p5a" name="pregunta5" value="datos">
                <label for="p5a">ಥ_ಥ (Perros)</label><br>

                <input type="radio" id="p5b" name="pregunta5" value="seguridad">
                <label for="p5b">╥﹏╥ (Gatos)</label><br>

                <input type="radio" id="p5c" name="pregunta5" value="ia">
                <label for="p5c">(∥￣■￣∥) (Conejos)</label><br>

                <input type="radio" id="p5d" name="pregunta5" value="software">
                <label for="p5d">༼ಢ_ಢ༽ (Serpientes)</label>
            </td>
        </tr>
    </table>

    <br>

    <div align="center">
        <button type="button" onclick="calcularResultado()">
            Ver mi resultado
        </button>
    </div>

    <br>

    <h2 id="resultado" align="center"></h2>

    <p align="center">
        Afinidad con la carrera:
        <progress id="afinidad" value="0" max="100"></progress>
        <span id="porcentaje">0%</span>
    </p>

    <script src="./script..js" defer></script>

</body>
</html>
